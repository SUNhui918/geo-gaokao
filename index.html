<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高三地理试题库 · 横山桥高中地理教研组</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="main-app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-brand">🌍 高三地理试题库</div>
        <nav class="topbar-nav">
          <button class="nav-btn active" data-tab="papers">📄 按试卷检索</button>
          <button class="nav-btn" data-tab="topics">🔖 按专题检索</button>
          <button class="nav-btn" data-tab="compose">🧩 组卷</button>
          <button class="nav-btn" data-tab="compare">📊 历年对比</button>
        </nav>
        <div class="topbar-org">常州市武进区横山桥高中地理教研组·地理试题库</div>
      </div>
    </header>

    <!-- 按试卷检索 -->
    <section id="tab-papers" class="tab-panel active">
      <div class="panel-header">
        <h2>📄 按试卷检索</h2>
        <p class="panel-desc">选省份、年份、类型，找到完整试卷 · <span id="stat-papers">0</span> 套试卷 · <span id="stat-questions">0</span> 道题目已收录</p>
      </div>

      <div class="search-bar">
        <input type="text" id="paper-search" class="search-input" placeholder="🔍 搜索试卷标题...">
        <select id="paper-filter-province" class="filter-select">
          <option value="">全部省份</option>
        </select>
        <select id="paper-filter-year" class="filter-select">
          <option value="">全部年份</option>
        </select>
        <select id="paper-filter-type" class="filter-select">
          <option value="">全部类型</option>
          <option>高考真题</option>
          <option>模拟题</option>
        </select>
      </div>

      <div id="paper-list" class="resource-list"></div>
    </section>

    <!-- 按专题检索 -->
    <section id="tab-topics" class="tab-panel">
      <div class="panel-header">
        <h2>🔖 按专题检索</h2>
        <p class="panel-desc">点击专题，汇集所有试卷中的相关试题，跨卷专练</p>
      </div>

      <div id="topic-overview">
        <div class="search-bar">
          <input type="text" id="topic-search" class="search-input" placeholder="🔍 输入关键词，直接全文检索所有题目（题干、材料、答案、解析、图片说明）...">
        </div>
        <div id="topic-groups"></div>
      </div>

      <div id="topic-detail" style="display:none;">
        <div class="topic-breadcrumb">
          <button id="topic-back" class="btn-ghost">← 返回专题列表</button>
          <span id="topic-current" class="topic-current"></span>
        </div>
        <div id="question-list" class="resource-list"></div>
      </div>
    </section>

    <!-- 组卷 -->
    <section id="tab-compose" class="tab-panel">
      <div class="panel-header">
        <h2>🧩 按专题组卷</h2>
        <p class="panel-desc">选择专题、难度和题量，自动抽题组成一份练习卷，可导出 Word</p>
      </div>

      <div class="compose-controls">
        <div class="compose-field">
          <label>专题（按住 Ctrl 多选）</label>
          <select id="compose-topics" class="compose-topics" multiple size="6"></select>
        </div>
        <div class="compose-field">
          <label>难度</label>
          <select id="compose-diff" class="filter-select">
            <option value="">全部</option>
            <option>易</option>
            <option>中</option>
            <option>难</option>
          </select>
        </div>
        <div class="compose-field">
          <label>题量</label>
          <input type="number" id="compose-count" class="search-input" value="10" min="1" max="60" style="width:110px;">
        </div>
        <button class="btn-primary" id="compose-btn" style="align-self:flex-end;">🎲 随机组题</button>
      </div>

      <div id="compose-result" class="resource-list"></div>
      <div id="compose-actions" class="form-actions" style="display:none;">
        <button class="btn-primary" id="export-student">📄 导出 Word（学生版）</button>
        <button class="btn-primary" id="export-teacher">📄 导出 Word（教师版·含答案解析）</button>
      </div>
    </section>

    <!-- 历年对比 -->
    <section id="tab-compare" class="tab-panel">
      <div class="panel-header">
        <h2>📊 历年题型对比</h2>
        <p class="panel-desc">对比各年份的题型结构和专题考查分布，辅助复习重点判断</p>
      </div>
      <div class="compare-section">
        <h3>题型结构</h3>
        <div id="compare-structure"></div>
      </div>
      <div class="compare-section">
        <h3>专题分布对比</h3>
        <div id="compare-topics"></div>
      </div>
      <div class="compare-section">
        <h3>高频考点 TOP 10</h3>
        <div id="compare-top"></div>
      </div>
    </section>

  </div>

  <!-- 试卷查看层（带水印） -->
  <div id="exam-viewer" class="exam-viewer" style="display:none;">
    <div class="viewer-toolbar">
      <button id="viewer-close" class="viewer-close">✕ 关闭</button>
      <span id="viewer-title" class="viewer-title"></span>
      <a id="viewer-newtab" class="viewer-newtab" target="_blank" rel="noopener noreferrer" style="display:none;">新窗口打开 ↗</a>
    </div>
    <div class="viewer-body">
      <div id="viewer-watermark" class="viewer-watermark"></div>
      <div id="viewer-content" class="viewer-content"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
